[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curuptures"
version = "0.1.0"
description = "GPU-accelerated change-point detection with CuPy"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "cupy-cuda13x"
]

[tool.setuptools.packages.find]
where = ["src"]
